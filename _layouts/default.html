<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/agenticly.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/agenticly-mark.svg' | relative_url }}" type="image/svg+xml">
  {%- feed_meta -%}
</head>
<body>
  <header class="site-head">
    <div class="site-head__inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Agenticly home">
        {%- include logo.html -%}
        <span class="brand-word">Agenticly</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Journal</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="nav-ghost" href="https://agenticly.app">Sign in</a>
        <a class="nav-cta" href="https://agenticly.app">Get started</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="site-foot__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        {%- include logo.html -%}
        <span class="brand-word">Agenticly</span>
      </a>
      <nav class="site-foot__nav">
        <a href="{{ '/' | relative_url }}">Journal</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <a href="https://agenticly.app">agenticly.app</a>
      </nav>
    </div>
    <div class="site-foot__base">
      <span>All rights reserved · Agenticly © {{ site.time | date: '%Y' }}</span>
      <span>Put your market research on autopilot.</span>
    </div>
  </footer>
</body>
</html>
